## Server config
server:
  port: 8081
  servlet:
    context-path: /
## Spring config
spring:
  application:
    name: jbang-app
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5433/my_db
    username: my_user
    password: secret
  jpa:
    open-in-view: false
#    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
## Actuator config
management:
  endpoints:
    web:
      exposure:
        include: "*"
        exclude: env
## Logging config
logging:
  level:
    com.example.jbang: DEBUG
