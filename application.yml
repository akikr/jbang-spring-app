## Server config
server:
  port: 8081
  servlet:
    context-path: /
## Spring config
spring:
  application:
    name: jbang-app
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
#    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: app-cp
      minimum-idle: 2
      maximum-pool-size: 10
      idle-timeout: 30000
      max-lifetime: 60000
      connection-timeout: 20000
      auto-commit: true
  jpa:
    open-in-view: false
#    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
## Actuator config
management:
  endpoints:
    web:
      exposure:
        include: "*"
        exclude: env
## Logging config
logging:
  level:
    com.example.jbang: DEBUG
